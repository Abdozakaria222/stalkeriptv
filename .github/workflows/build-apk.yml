name: Build APK
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths-ignore: ['pc/**', 'pc-ci/**', '.github/workflows/build-pc.yml', 'docs/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: StalkerTV-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk-build branch
        run: |
          mkdir /tmp/pub && cp app/build/outputs/apk/debug/*.apk /tmp/pub/StalkerTV.apk
          cd /tmp/pub && git init -q -b apk-build && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add StalkerTV.apk && git commit -q -m "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
      - name: Publish the build log when the build fails
        if: failure()
        run: |
          mkdir -p /tmp/log && tail -c 400000 build.log > /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          cd /tmp/log && git init -q -b apk-build-log && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add build.log && git commit -q -m "APK build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build-log
