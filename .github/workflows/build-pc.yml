name: Build PC (Windows exe + VLC)
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ['pc/**', 'pc-ci/**', '.github/workflows/build-pc.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller pywebview python-vlc
      - name: Portable VLC (latest 64-bit release, without its own interface)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://download.videolan.org/pub/videolan/vlc/last/win64/'
          $html = (Invoke-WebRequest -UseBasicParsing -Uri $base).Content
          $name = [regex]::Match($html, 'vlc-[0-9.]+-win64\.zip(?!\.)').Value
          if (-not $name) { throw "no VLC zip found in $base" }
          Write-Host "VLC: $name"
          Invoke-WebRequest -UseBasicParsing -Uri ($base + $name) -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlcx
          $src = (Get-ChildItem vlcx -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force out/StalkerTV-PC/ffmpeg | Out-Null
          Move-Item $src out/StalkerTV-PC/vlc
          $v = 'out/StalkerTV-PC/vlc'
          foreach ($d in 'sdk', 'skins', 'plugins/gui', 'plugins/visualization', 'plugins/video_splitter') { if (Test-Path "$v/$d") { Remove-Item -Recurse -Force "$v/$d" } }
          foreach ($f in 'axvlc.dll', 'npvlc.dll') { if (Test-Path "$v/$f") { Remove-Item -Force "$v/$f" } }
          if (Test-Path "$v/locale") { Get-ChildItem "$v/locale" -Directory | Where-Object { $_.Name -ne 'ar' } | Remove-Item -Recurse -Force }
          if (Test-Path "$v/plugins/plugins.dat") { Remove-Item -Force "$v/plugins/plugins.dat" }
          & "$v/vlc-cache-gen.exe" "$v/plugins"
          $mb = [math]::Round(((Get-ChildItem $v -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "VLC folder: $mb MB"
      - name: Build StalkerTV.exe
        working-directory: pc
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --name StalkerTV --collect-all webview --hidden-import vlc --add-data "app;app" StalkerTV.py
          Copy-Item dist/StalkerTV.exe ../out/StalkerTV-PC/
          Copy-Item README.txt ../out/StalkerTV-PC/
          Copy-Item ffmpeg/PUT-FFMPEG-HERE.txt ../out/StalkerTV-PC/ffmpeg/
      - name: Self-test (VLC inside a window, from source and from the exe)
        continue-on-error: true
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $media = "$ws\pc-ci\test.mkv"
          $env:VLC_PATH = "$ws\out\StalkerTV-PC\vlc\vlc.exe"
          $p = Start-Process -FilePath python -ArgumentList "pc\StalkerTV.py", "--selftest-vlc", $media, "$ws\selftest-source.txt" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Add-Content "$ws\selftest-source.txt" "TIMEOUT" }
          Remove-Item Env:VLC_PATH
          $p = Start-Process -FilePath "$ws\out\StalkerTV-PC\StalkerTV.exe" -ArgumentList "--selftest-vlc", $media, "$ws\selftest-exe.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Add-Content "$ws\selftest-exe.txt" "TIMEOUT" }
          Get-Content "$ws\selftest-source.txt", "$ws\selftest-exe.txt" -ErrorAction SilentlyContinue
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/StalkerTV-PC -DestinationPath StalkerTV-PC-Windows.zip -Force
          Write-Host ("zip: {0:N1} MB" -f ((Get-Item StalkerTV-PC-Windows.zip).Length / 1MB))
      - name: Publish to the pc-build branch
        shell: bash
        run: |
          mkdir /tmp/pub && cp StalkerTV-PC-Windows.zip /tmp/pub/
          cp selftest-*.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b pc-build && git config user.name actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m "PC build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" pc-build
