<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>Stalker TV</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/luxe.css">
<script src="js/android-shim.js"></script>
</head>
<body>
<div id="app">
  <div id="bg"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div>
  <object id="avplayer" type="application/avplayer"></object>
  <div id="stage"><video id="vid" playsinline></video><div id="stageMsg"></div></div>
  <section id="s-accounts" class="screen"></section>
  <section id="s-form" class="screen"></section>
  <section id="s-loading" class="screen"></section>
  <section id="s-browse" class="screen"></section>
  <section id="s-full" class="screen"></section>
  <section id="s-hub" class="screen"></section>
  <section id="s-rows" class="screen"></section>
  <section id="s-detail" class="screen"></section>
  <section id="s-settings" class="screen"></section>
  <section id="s-vod" class="screen"></section>
  <section id="s-qr" class="screen"></section>
  <div id="subs"></div>
  <div id="pmenu"></div>
  <div id="numbox"></div>
  <div id="toast"></div>
</div>
<script src="js/app.js"></script>
<script src="js/qr.js"></script>
<script src="js/subs.js"></script>
<script src="js/media.js"></script>
<script src="js/extras.js"></script>
<script src="js/epg.js"></script>
</body>
</html>
